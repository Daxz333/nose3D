<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 换鼻服务系统</title>
<style>
:root{
  --bg:#05070d;
  --cyan:#00f0ff;
  --blue:#2b7fff;
  --panel:rgba(10,18,30,.82);
  --panel-2:rgba(8,14,24,.9);
  --line:rgba(0,240,255,.28);
  --line-soft:rgba(0,240,255,.12);
  --text:#cfe9f5;
  --muted:#5f7c92;
  --danger:#ff4d6d;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1000px 520px at 85% -10%,rgba(0,240,255,.10),transparent 60%),
    radial-gradient(900px 500px at 5% 110%,rgba(43,127,255,.10),transparent 60%),
    linear-gradient(rgba(0,240,255,.04) 1px,transparent 1px) 0 0/42px 42px,
    linear-gradient(90deg,rgba(0,240,255,.04) 1px,transparent 1px) 0 0/42px 42px,
    var(--bg);
  min-height:100vh;
  overflow-x:hidden;
}
/* 顶部扫描光带 */
body::after{
  content:"";
  position:fixed;left:0;top:0;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.45;
  animation:scan 7s linear infinite;
  pointer-events:none;
  z-index:99;
}
@keyframes scan{0%{transform:translateY(0);}100%{transform:translateY(100vh);}}

#container{display:flex;min-height:100vh;}

/* ---------- 侧边栏 ---------- */
#sidebar{
  width:190px;flex:0 0 190px;
  background:linear-gradient(180deg,rgba(8,14,24,.96),rgba(6,10,18,.96));
  border-right:1px solid var(--line-soft);
  padding:26px 0;position:sticky;top:0;height:100vh;
}
#sidebar::before{
  content:"NOSE·AI";
  display:block;padding:0 22px 22px;
  font-family:Consolas,monospace;letter-spacing:3px;font-size:15px;
  color:var(--cyan);text-shadow:0 0 12px rgba(0,240,255,.6);
  border-bottom:1px solid var(--line-soft);margin-bottom:16px;
}
#sidebar a{
  display:block;padding:12px 22px;margin:4px 0;
  color:var(--muted);text-decoration:none;font-size:14px;
  border-left:2px solid transparent;transition:.25s;
}
#sidebar a:hover{
  color:var(--cyan);border-left-color:var(--cyan);
  background:linear-gradient(90deg,rgba(0,240,255,.10),transparent);
  text-shadow:0 0 10px rgba(0,240,255,.5);
}

/* ---------- 主区域 ---------- */
#main-content{flex:1;padding:34px 44px;max-width:1200px;}
h1{
  margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:2px;
  color:#eafcff;text-shadow:0 0 18px rgba(0,240,255,.45);
}
.subtitle{
  font-family:Consolas,monospace;font-size:12px;letter-spacing:2px;
  color:var(--muted);margin-bottom:26px;
}
.subtitle .dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan);
  margin-right:8px;animation:pulse 1.6s infinite;vertical-align:middle;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

.divider{display:flex;align-items:center;gap:14px;margin:22px 0;}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);}
.divider-text{font-family:Consolas,monospace;font-size:12px;letter-spacing:3px;color:var(--cyan);}

/* ---------- 面板 ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:10px;padding:22px;position:relative;
  backdrop-filter:blur(6px);
  box-shadow:0 0 0 1px rgba(0,240,255,.04) inset,0 18px 40px rgba(0,0,0,.45);
}
.panel::before,.panel::after{
  content:"";position:absolute;width:14px;height:14px;border:2px solid var(--cyan);opacity:.7;
}
.panel::before{left:-1px;top:-1px;border-right:none;border-bottom:none;border-radius:10px 0 0 0;}
.panel::after{right:-1px;bottom:-1px;border-left:none;border-top:none;border-radius:0 0 10px 0;}

.tools{display:flex;flex-wrap:wrap;gap:22px;align-items:stretch;}
.file-slot{flex:1;min-width:220px;}

.custom-file-upload{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  height:120px;cursor:pointer;gap:8px;
  border:1px dashed var(--line);border-radius:8px;
  background:rgba(0,240,255,.03);color:var(--text);
  font-size:14px;letter-spacing:1px;transition:.25s;text-align:center;
}
.custom-file-upload:hover{
  border-color:var(--cyan);background:rgba(0,240,255,.08);
  box-shadow:0 0 22px rgba(0,240,255,.18) inset;color:var(--cyan);
}
.custom-file-upload .tag{font-family:Consolas,monospace;font-size:11px;color:var(--muted);letter-spacing:2px;}
input[type="file"]{display:none;}

button{
  font-family:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;
  color:#02121a;font-weight:700;height:100%;min-height:48px;
  padding:0 30px;border:none;border-radius:8px;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  box-shadow:0 0 22px rgba(0,240,255,.35);transition:.25s;
}
button:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(0,240,255,.6);}
button:active{transform:translateY(0);}
.btn-wrap{display:flex;align-items:center;}

#errorMessage{color:var(--danger);margin-top:16px;font-size:13px;min-height:18px;letter-spacing:.5px;}

/* ---------- 预览 ---------- */
#selectedImages{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap;}
.img-card{flex:1;min-width:240px;position:relative;}
.img-card img{
  width:100%;height:260px;object-fit:contain;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line-soft);
}
.img-card .label{
  position:absolute;top:10px;left:10px;z-index:2;
  font-family:Consolas,monospace;font-size:11px;letter-spacing:2px;
  color:var(--cyan);background:rgba(5,10,18,.85);
  padding:3px 9px;border:1px solid var(--line);border-radius:4px;
}

#resultContainer{margin-top:26px;display:flex;justify-content:center;}
#resultContainer img{
  max-width:100%;max-height:520px;border-radius:10px;
  border:1px solid var(--line);box-shadow:0 0 40px rgba(0,240,255,.18);
}
</style>
</head>
<body>
<div id="container">
  <div id="sidebar">
    <a href="#" onclick="openPersonalCenter();return false;">管理中心</a>
    <a href="#" onclick="openUserGallery();return false;">用户图库</a>
    <a href="#" onclick="showContactInfo();return false;">联系客服</a>
  </div>

  <div id="main-content">
    <h1>AI 换鼻服务系统</h1>
    <div class="subtitle"><span class="dot"></span>NEURAL NOSE TRANSFER · SYSTEM ONLINE</div>

    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">INPUT MODULE</span>
      <span class="divider-line"></span>
    </div>

    <div class="panel">
      <form id="imageForm" enctype="multipart/form-data">
        <div class="tools">
          <div class="file-slot">
            <label class="custom-file-upload">
              <span>选择人脸图片</span>
              <span class="tag">FACE / TARGET</span>
              <input type="file" name="face_image" accept="image/*" onchange="previewImage(event,'selectedFaceImage')">
            </label>
          </div>
          <div class="file-slot">
            <label class="custom-file-upload">
              <span>选择部位来源图片</span>
              <span class="tag">REGION / SOURCE</span>
              <input type="file" name="nose_image" accept="image/*" onchange="previewImage(event,'selectedNoseImage')">
            </label>
          </div>
          <div class="btn-wrap">
            <button type="button" onclick="processImages()">开始处理</button>
          </div>
        </div>
        <label for="region">替换部位</label>
        <select id="region" name="region">
          <option value="nose">鼻子</option>
          <option value="eye">双眼</option>
          <option value="mouth">口腔（两张图都需张嘴且幅度相近）</option>
          <option value="brow">双眉</option>
          <option value="lip">嘴唇</option>
          <option value="l_eye">左眼</option>
          <option value="r_eye">右眼</option>
          <option value="l_brow">左眉</option>
          <option value="r_brow">右眉</option>
          <option value="u_lip">上唇</option>
          <option value="l_lip">下唇</option>
        </select>
        <p>嘴唇替换需张嘴 / 闭嘴状态一致；单侧部位按同名侧匹配，请使用方向一致的照片。</p>
      </form>
    </div>

    <div id="errorMessage"></div>

    <div id="selectedImages">
      <div class="img-card"><span class="label">FACE</span><img id="selectedFaceImage" alt="Selected Face Image"></div>
      <div class="img-card"><span class="label">NOSE</span><img id="selectedNoseImage" alt="Selected Nose Image"></div>
    </div>

    <div id="resultContainer"></div>
  </div>
</div>

<script>
  function previewImage(event, imageId){
    const file = event.target.files[0];
    const imgElement = document.getElementById(imageId);
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){ imgElement.src = reader.result; };
    reader.readAsDataURL(file);
  }

  function processImages(){
    const faceImage = document.getElementsByName("face_image")[0].files[0];
    const noseImage = document.getElementsByName("nose_image")[0].files[0];
    const err = document.getElementById("errorMessage");

    if(!faceImage || !noseImage){
      err.textContent = "请同时选择人脸图片和部位来源图片。";
      return;
    }
    err.textContent = "处理中，请稍候…";

    const formData = new FormData();
    formData.append("face_image", faceImage);
    formData.append("nose_image", noseImage);
    formData.append("region", document.getElementById("region").value);

    const url = "/predict?timestamp=" + Date.now();
    fetch(url, { method:"POST", body:formData, credentials:"same-origin" })
      .then(response => response.json())
      .then(data => {
        if(data.success){
          err.textContent = "";
          const resultImage = document.createElement("img");
          resultImage.src = "data:image/jpeg;base64," + data.result;
          const box = document.getElementById("resultContainer");
          box.innerHTML = "";
          box.appendChild(resultImage);
        } else {
          err.textContent = "Error: " + data.error;
        }
      })
      .catch(error => { err.textContent = "请求失败： " + error; });
  }

  function openUserGallery(){
    const input = document.createElement("input");
    input.type = "file";
    input.click();
  }

  function openPersonalCenter(){
    window.open("https://portal.qiniu.com/kodo/bucket/resource-v2?bucketName=oos1323", "_blank");
  }

  function showContactInfo(){
    alert("电话：17828056125\n邮箱：1323049452@qq.com");
  }
</script>
</body>
</html>
